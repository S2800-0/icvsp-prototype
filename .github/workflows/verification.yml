# V-cycle verification on every push: one job per level (unit, integration, system), then requirement traceability.
# Security scans (Gitleaks, Semgrep, Trivy) are added by the cybersecurity team (Gantt C2).
name: verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash      # bash -eo pipefail: a failing command fails the step even when its output is piped to tee

jobs:
  # ---- left side of the V is the requirements and design; these jobs are the right side, one per level ----
  unit-firmware:
    name: "Unit: device firmware (C++, Unity)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: PlatformIO native tests
        working-directory: firmware
        run: pio test -e native -v --junit-output-path ../firmware.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with: {name: results-firmware, path: firmware.xml}

  unit-engine:
    name: "Unit + component: trust engine"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-cov cryptography
      - name: Engine tests with coverage
        run: python -m pytest engine/tests -v --junitxml=engine.xml --cov=engine/icvsp --cov-report=term-missing --cov-report=html:coverage-engine
      - name: Coverage summary
        run: |
          echo "### Trust engine code coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: results-engine
          path: |
            engine.xml
            coverage-engine

  integration-backend:
    name: "Integration: backend API"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-cov cryptography fastapi httpx
      - name: Backend tests with coverage (signatures, registry, replay, sign-in, roles, rate limits)
        run: python -m pytest backend/tests -v --junitxml=backend.xml --cov=backend/icvsp_backend --cov-report=term-missing --cov-report=html:coverage-backend
      - name: Coverage summary
        run: |
          echo "### Backend code coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: results-backend
          path: |
            backend.xml
            coverage-backend

  integration-device-engine:
    name: "Integration: device reports -> engine (Ed25519)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio cryptography
      - name: Reports signed by the device code, checked by an independent library
        working-directory: firmware
        run: python tools/check_with_engine.py | tee ../integration.log
      - uses: actions/upload-artifact@v6
        if: always()
        with: {name: results-integration, path: integration.log}

  system-sil:
    name: "System: whole chain in simulation"
    needs: [unit-firmware, unit-engine, integration-backend, integration-device-engine]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest cryptography fastapi httpx
      - name: 40 simulated cars with faults and attackers (real device code, real backend)
        run: python -m pytest sil/test_sil.py sil/test_ble_link.py -v --junitxml=sil.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with: {name: results-sil, path: sil.xml}

  traceability:
    name: "Traceability: requirement -> test -> result"
    needs: [unit-firmware, unit-engine, integration-backend, integration-device-engine, system-sil]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - name: Test report (all levels)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: Test results
          files: results/*.xml
      - name: Requirement coverage
        run: |
          python verification/check_traceability.py --junit results/firmware.xml --junit results/engine.xml \
            --junit results/backend.xml --junit results/sil.xml --integration-log results/integration.log \
            --out traceability_report.md
          cat traceability_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verification-evidence
          path: |
            results
            traceability_report.md

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python (ruff, pyflakes rules)
        run: |
          pip install ruff
          ruff check --select F engine backend sil firmware/tools verification
          ruff check --select E9,F63,F7,F82 ai/scripts
      - name: C++ (cppcheck)
        # reported but not yet blocking: switched to blocking once the first report is clean
        continue-on-error: true
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q cppcheck
          cppcheck --std=c++17 --enable=warning,performance,portability --error-exitcode=1 --inline-suppr \
            --suppress=missingIncludeSystem -I firmware/lib/icvsp_core/src -I firmware/lib/icvsp_sim/src \
            firmware/lib/icvsp_core/src firmware/lib/icvsp_sim/src firmware/src
