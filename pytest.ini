# pytest runs every Python suite from the repo root (VS Code Testing panel, CI JUnit reports).
# Each suite also still runs with plain unittest from its own folder (see verification/README.md).
[pytest]
testpaths = engine/tests backend/tests sil/test_sil.py sil/test_ble_link.py
pythonpath = backend engine sil
addopts = --import-mode=importlib
# third-party notice from Starlette about FastAPI's test client (httpx -> httpx2), not about this code
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
