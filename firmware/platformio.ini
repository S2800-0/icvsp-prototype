; ICVSP device firmware.
;
; The device logic (lib/icvsp_core) is plain C++ with no hardware calls, so it builds and is unit-tested
; on a laptop with the `native` environment:
;     pio test -e native
;     pio run -e native && .pio/build/native/program      (demo: a synthetic drive)
;
; The board environment is left commented out until we have a board: it downloads the ESP32 toolchain
; (several hundred MB) the first time it is built.

[platformio]
default_envs = native

[env]
test_framework = unity

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra

; [env:xiao_esp32s3]
; platform = espressif32
; board = seeed_xiao_esp32s3
; framework = arduino
; build_flags = -std=gnu++17
; monitor_speed = 115200
